[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "citefield"
dynamic = ["version"]
description = "Extract metadata from technical manuals, with a verifiable citation for every value."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alessio Chessa", email = "ale.chessa28@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "pdfplumber",
  "pydantic>=2",
  "pint",
  "litellm",
  "pyyaml",
  "tenacity", # LiteLLM retries API errors with it but doesn't declare it
]

[project.optional-dependencies]
docling = ["docling"]
pypdf = ["pypdf"]
# AGPL-3.0: installing this extra puts AGPL obligations on that setup.
pymupdf = ["pymupdf"]

[project.urls]
Repository = "https://github.com/aleche28/citefield"

[project.scripts]
citefield = "citefield.cli:main"

[project.entry-points."citefield.parsers"]
pdfplumber = "citefield.parsers.pdfplumber:PdfplumberParser"
markdown = "citefield.parsers.markdown:MarkdownParser"

[project.entry-points."citefield.llm_backends"]
litellm = "citefield.llm.litellm:LiteLLMBackend"

[dependency-groups]
dev = ["pytest", "ruff"]

# The version comes from the git tag: v0.2.0 -> 0.2.0 (ADR-0025).
[tool.hatch.version]
source = "vcs"

# Builds between tags get 0.2.dev3, not 0.2.dev3+gabc1234: PyPI rejects local versions,
# and the TestPyPI dry run publishes such a build.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# The test corpus keeps its own licenses and is not shipped (ADR-0011).
[tool.hatch.build.targets.sdist]
exclude = ["/corpus"]

# Rebuild the editable install, and so its version, on new commits and tags.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real LLM and costs money; run with -m live"]
